name: Update Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 자정 UTC (한국시간 오전 9시)
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_1: ${{ secrets.PAT_1 }}
        run: python scripts/generate_lang_stats.py

      - name: Generate GitHub stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_1: ${{ secrets.PAT_1 }}
        run: python scripts/generate_github_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lang-stats.svg github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats cards"
            git push
          fi
